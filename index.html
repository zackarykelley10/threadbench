<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body><title>Threadbench</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a workbench — tool rail left, the hoop on fabric in the middle, the selected piece's settings and the sew order on the right. */
:root{
  --bg:#e9eef0; --panel:#fbfcfc; --ink:#1b2730; --muted:#5a6873; --line:#d3dce1; --soft:#f0f4f5;
  --accent:#0e7470; --accent-ink:#ffffff; --accent-soft:#d8eeec; --warn:#a2521a; --err:#b3261e; --ok:#2f7a3b;
  --hoop:#7d8c96; --grid:rgba(30,50,60,.08);
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12181c; --panel:#192127; --ink:#e3eaee; --muted:#98a6b0; --line:#2b363e; --soft:#1f292f;
  --accent:#43b3ac; --accent-ink:#0b1a1a; --accent-soft:#183634; --warn:#e3995e; --err:#ff8a80; --ok:#7fcf8c;
  --hoop:#8b9aa4; --grid:rgba(30,50,60,.10); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#12181c; --panel:#192127; --ink:#e3eaee; --muted:#98a6b0; --line:#2b363e; --soft:#1f292f;
  --accent:#43b3ac; --accent-ink:#0b1a1a; --accent-soft:#183634; --warn:#e3995e; --err:#ff8a80; --ok:#7fcf8c;
  --hoop:#8b9aa4; --grid:rgba(30,50,60,.10); color-scheme:dark }
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.4 var(--f-body);margin:0}
.app{display:flex;flex-direction:column;height:100%;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;gap:10px}
header{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{font:700 20px/1 var(--f-display);letter-spacing:-.01em;display:flex;align-items:center;gap:8px;margin-right:6px}
.brand svg{width:22px;height:22px}
header .grow{flex:1}
button,select,input,textarea{font:inherit;color:var(--ink)}
button{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:7px 11px;cursor:pointer;white-space:nowrap}
button:hover{border-color:var(--hoop)}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
button.ghost{background:transparent;border-color:transparent;padding:5px 7px;color:var(--muted)}
button.ghost:hover{color:var(--ink);border-color:var(--line)}
button:disabled{opacity:.45;cursor:default}
select,input[type=text],input[type=number],textarea{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-width:0}
input[type=number]{width:100%;font-family:var(--f-mono);font-size:13px}
textarea{width:100%;resize:vertical;min-height:58px}
input[type=color]{width:34px;height:28px;border:1px solid var(--line);border-radius:6px;padding:2px;background:var(--panel);cursor:pointer}
input[type=range]{width:100%;accent-color:var(--accent)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{border:0;border-radius:0;padding:6px 10px}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--ink);font-weight:600}
.main{flex:1;min-height:0;display:grid;grid-template-columns:132px minmax(0,1fr) 330px;gap:10px}
.rail{display:flex;flex-direction:column;gap:6px}
.rail .label{font:600 11px var(--f-body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:4px 2px}
.rail button{text-align:left;display:flex;align-items:center;gap:8px;padding:9px 10px}
.rail button svg{width:18px;height:18px;flex:none;color:var(--accent)}
.stage{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;min-height:320px;display:flex;flex-direction:column}
.stage canvas{flex:1;width:100%;min-height:0;display:block;touch-action:none;cursor:default}
.stagebar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:7px 10px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.stagebar .stat{font-family:var(--f-mono);font-size:12.5px;color:var(--ink)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;border-radius:99px;padding:2px 9px}
.pill.ok{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.pill.bad{background:color-mix(in srgb,var(--err) 14%,transparent);color:var(--err)}
.zoom{position:absolute;top:8px;right:8px;display:flex;gap:4px}
.zoom button{padding:4px 9px;font-family:var(--f-mono)}
.side{display:flex;flex-direction:column;gap:10px;min-height:0;overflow:auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:9px}
.card h2{font:700 14px var(--f-display);margin:0;display:flex;align-items:center;gap:8px}
.card h2 .sub{font:500 12px var(--f-body);color:var(--muted)}
.f{display:grid;grid-template-columns:96px minmax(0,1fr);align-items:center;gap:8px;font-size:13px}
.f>span:first-child{color:var(--muted)}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.two .f{grid-template-columns:auto minmax(0,1fr)}
.hint{font-size:12.5px;color:var(--muted)}
.hint.warn{color:var(--warn)}
.order{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.order li{display:flex;align-items:center;gap:8px;padding:6px 7px;border:1px solid transparent;border-radius:7px;cursor:pointer}
.order li:hover{background:var(--soft)}
.order li[aria-selected="true"]{border-color:var(--accent);background:var(--accent-soft)}
.order .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.order .num{font:500 11px var(--f-mono);color:var(--muted);width:16px;text-align:right}
.chips{display:flex;gap:2px}
.chip{width:12px;height:12px;border-radius:3px;border:1px solid rgba(0,0,0,.18)}
.colors{display:flex;flex-direction:column;gap:6px}
.colors .c{display:flex;align-items:center;gap:8px;font-size:13px}
.colors .c .code{font:12px var(--f-mono);color:var(--muted)}
.empty{color:var(--muted);font-size:13px;padding:6px 2px}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:9px 14px;border-radius:8px;font-size:13.5px;max-width:min(560px,calc(100% - 32px));box-shadow:0 6px 24px rgba(0,0,0,.18);z-index:20}
.toast.err{background:var(--err);color:#fff}
.drop{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--accent) 12%,transparent);border:2px dashed var(--accent);border-radius:10px;font-weight:600;pointer-events:none}
.colors .c{align-items:flex-start}
.tl{display:flex;flex-direction:column;gap:1px;min-width:0}
.tl>span{font-size:12px;color:var(--muted)}
.thr{border:0;background:none;padding:0;text-align:left;display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink);white-space:normal}
.thr:hover{text-decoration:underline}
.thr em{font-style:normal;font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 4px}
.chip.big{width:16px;height:16px;flex:none}
.tlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;max-height:340px;overflow:auto}
.tlist li{display:flex;align-items:flex-start;gap:8px;font-size:13px}
.tlist .tx{min-width:0;display:flex;flex-direction:column}
.tlist small{color:var(--muted);font-size:11.5px;overflow-wrap:anywhere}
.steps{margin:0;padding-left:20px;font-size:13px;display:flex;flex-direction:column;gap:4px}
.picker{position:fixed;z-index:30;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.18);padding:10px;display:flex;flex-direction:column;gap:8px}
.picker .pk-head{display:flex;justify-content:space-between;align-items:baseline}
.picker input{width:100%}
.pk-list{list-style:none;margin:0;padding:0;max-height:300px;overflow:auto}
.pk-list button{width:100%;border:0;background:none;text-align:left;display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:6px;white-space:normal}
.pk-list button:hover{background:var(--soft)}
#splitcard{border-color:var(--accent)}
.simbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:7px 10px;border-top:1px solid var(--line);background:var(--soft)}
.simbar .stat{font:12.5px var(--f-mono);color:var(--ink)}
details.more summary{cursor:pointer;color:var(--muted);font-size:13px}
details.more[open] summary{margin-bottom:8px}
.kbd{font:11px var(--f-mono);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px;color:var(--muted)}
@media (max-width:980px){
  .main{grid-template-columns:1fr;grid-auto-rows:auto}
  .rail{flex-direction:row;flex-wrap:wrap}
  .rail .label{width:100%}
  .rail button{flex:1 1 140px}
  .stage{height:62vh}
  .side{overflow:visible}
  html,body{height:auto}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app" id="app">
  <header>
    <div class="brand" aria-label="Threadbench">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5.5" stroke-dasharray="2 2.2"/><path d="M3 12h3M18 12h3"/></svg>
      Threadbench
    </div>
    <input type="text" id="dname" value="Design" aria-label="Design name" style="width:150px">
    <label class="row" style="gap:6px"><span class="hint">Hoop</span>
      <select id="hoop" aria-label="Hoop size"></select></label>
    <div class="seg" role="group" aria-label="Units"><button id="u-in" aria-pressed="true">in</button><button id="u-mm" aria-pressed="false">mm</button></div>
    <div class="grow"></div>
    <button class="ghost" id="undo" title="Undo (Ctrl+Z)">Undo</button>
    <button class="ghost" id="redo" title="Redo (Ctrl+Y)">Redo</button>
    <button id="open">Open…</button>
    <button id="saveproj">Save project</button>
    <select id="fmt" aria-label="File format" title="File format"><option value="pes">PES (Brother)</option><option value="dst">DST (Tajima)</option><option value="exp">EXP (Melco)</option><option value="jef">JEF (Janome)</option></select>
    <button class="primary" id="savepes">Save PES</button>
    <input type="file" id="file" hidden accept=".svg,.pes,.dst,.json,.tbproj,.ttf,.otf,.woff">
  </header>

  <div class="main">
    <nav class="rail" aria-label="Add">
      <div class="label">Add</div>
      <button id="add-text"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 6V4h14v2M12 4v16M9 20h6"/></svg>Lettering</button>
      <button id="add-mono"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 17l2.5-8L8 17M4 14h3M11 19V5l3 6 3-6v14M20 9v8"/></svg>Monogram</button>
      <button id="add-shape"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z" stroke-dasharray="3 2"/></svg>Applique shape</button>
      <button id="add-art"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19c3-9 7-13 16-15-2 9-6 13-15 16z"/><path d="M4 19l7-7"/></svg>Artwork (SVG)</button>
      <button id="add-file"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3h8l4 4v14H6z"/><path d="M9 13l3-3 3 3M12 10v7"/></svg>Design file</button>
      <div class="label" style="margin-top:10px">Fabric</div>
      <div class="row"><input type="color" id="fabric" value="#f7f6f2" aria-label="Fabric color"><span class="hint">color</span></div>
      <div class="label" style="margin-top:10px">Keys</div>
      <div class="hint" style="line-height:1.9">Arrows nudge<br><span class="kbd">Del</span> remove<br><span class="kbd">Ctrl</span>+<span class="kbd">D</span> copy</div>
    </nav>

    <section class="stage" id="stage" aria-label="Hoop">
      <canvas id="cv"></canvas>
      <div class="zoom"><button id="sim-btn" title="Watch the design sew, stitch by stitch">▶ Sew it</button><button id="z-out" aria-label="Zoom out">−</button><button id="z-fit">Fit</button><button id="z-in" aria-label="Zoom in">+</button></div>
      <div class="simbar" id="simbar" hidden>
        <button id="sim-play" style="min-width:74px">Pause</button>
        <select id="sim-speed" aria-label="Speed"><option value="3">Slow</option><option value="12" selected>Normal</option><option value="45">Fast</option><option value="180">Very fast</option></select>
        <input type="range" id="sim-pos" min="0" max="1000" value="0" aria-label="Sewing progress" style="flex:1;min-width:120px">
        <span class="stat" id="sim-info"></span>
        <button id="sim-close">Close</button>
      </div>
      <div class="stagebar" id="stats"></div>
      <div class="drop" id="dropzone" hidden>Drop SVG, PES, DST or a project to add it</div>
    </section>

    <aside class="side">
      <div class="card" id="splitcard" hidden></div>
      <div class="card" id="props"></div>
      <div class="card">
        <h2>Sew order <span class="sub">top sews first</span></h2>
        <ul class="order" id="order"></ul>
      </div>
      <div class="card" id="threads"></div>
    </aside>
  </div>
</div>
<div class="toast" id="toast" hidden></div>
<div id="svghost" style="position:absolute;left:-99999px;top:0;width:10px;height:10px;overflow:hidden" aria-hidden="true"></div>
